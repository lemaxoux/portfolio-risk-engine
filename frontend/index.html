<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      DESIGN.md §4 — `color-scheme` est obligatoire : sans lui, barres de
      défilement, champs de saisie et cases à cocher restent clairs dans le
      thème sombre. Le contenu est réécrit par le script ci-dessous quand un
      thème a été figé, pour que le navigateur peigne son canevas initial de la
      bonne couleur au lieu de la corriger après coup.
    -->
    <meta name="color-scheme" content="light dark" />

    <!--
      Pas d'icône, et c'est dit explicitement. Sans cette ligne, le navigateur
      demande /favicon.ico à chaque chargement et inscrit un 404 dans la
      console — un bruit permanent qui use l'attention qu'on doit garder pour
      les vraies erreurs. §12 interdit les icônes décoratives : il n'y a donc
      rien à mettre ici tant que le produit n'a pas de marque.
    -->
    <link rel="icon" href="data:," />
    <title>Portfolio Risk Engine</title>

    <!--
      Surcharge de thème — SCRIPT EN LIGNE ET BLOQUANT, délibérément.

      Le bundle React est un module : il est chargé après le premier rendu.
      Poser le thème là-bas ferait apparaître le thème système pendant une
      poignée d'images avant la correction — l'éclair du mauvais thème, à
      chaque chargement, pour tout utilisateur qui a figé le thème contraire au
      sien. Ce script s'exécute avant que le corps n'existe : il n'y a rien à
      repeindre.

      La valeur stockée est LITTÉRALEMENT « light » ou « dark », jamais
      « l'inverse du système » recalculé à l'affichage : si le système bascule
      ensuite, l'application ne bouge pas. Absence de clé = on suit le système,
      ce que le CSS fait déjà tout seul (§4) — donc sans JavaScript aussi.

      `try/catch` : la lecture de `localStorage` LÈVE, elle ne rend pas null,
      quand le stockage est bloqué. Sans lui, la page resterait blanche.
    -->
    <script>
      (function () {
        try {
          var choix = localStorage.getItem('mx-risk-theme')
          if (choix !== 'light' && choix !== 'dark') return
          document.documentElement.setAttribute('data-theme', choix)
          var meta = document.querySelector('meta[name="color-scheme"]')
          if (meta) meta.setAttribute('content', choix)
        } catch (erreur) {
          /* Stockage bloqué : on suit le système, sans erreur. */
        }
      })()
    </script>

    <!--
      Langue de la page (chantier 7D) — SCRIPT EN LIGNE ET BLOQUANT, comme le
      thème, et pour la même raison : l'attribut `lang` doit être juste avant
      le premier rendu. Il conditionne la coupure des mots des chapeaux
      (`hyphens: auto`), la voix des lecteurs d'écran et le dictionnaire du
      navigateur.

      Dans l'ordre : `?lang=fr` ou `?lang=en` dans l'adresse, qui vaut un
      choix (mémorisé, puis retiré de l'adresse : recharger après un
      changement au bouton ne doit pas rétablir l'ancienne langue) ; sinon le
      choix mémorisé ; sinon la première langue du navigateur qui est du
      français ou de l'anglais ; sinon le français. React lit ensuite
      l'attribut (`src/lib/langue.ts`, où ce choix est écrit et testé, et où
      `langue.test.ts` fait tourner ce script sur les mêmes cas).
    -->
    <script id="choix-de-la-langue">
      (function () {
        var langue = null
        try {
          var adresse = new URLSearchParams(location.search)
          var demandee = adresse.get('lang')
          if (demandee === 'fr' || demandee === 'en') {
            langue = demandee
            try {
              localStorage.setItem('mx-risk-langue', demandee)
            } catch (erreur) {
              /* Stockage bloqué : la langue vaut pour ce chargement. */
            }
            adresse.delete('lang')
            var reste = adresse.toString()
            history.replaceState(
              history.state,
              '',
              location.pathname + (reste ? '?' + reste : '') + location.hash
            )
          }
        } catch (erreur) {
          /* Adresse illisible : on passe au choix suivant. */
        }
        if (langue === null) {
          try {
            var memorisee = localStorage.getItem('mx-risk-langue')
            if (memorisee === 'fr' || memorisee === 'en') langue = memorisee
          } catch (erreur) {
            /* Stockage bloqué : la langue du navigateur décide. */
          }
        }
        if (langue === null) {
          var langues =
            navigator.languages && navigator.languages.length > 0
              ? navigator.languages
              : [navigator.language || '']
          for (var rang = 0; rang < langues.length && langue === null; rang += 1) {
            var principale = String(langues[rang]).toLowerCase().split('-')[0]
            if (principale === 'fr' || principale === 'en') langue = principale
          }
        }
        document.documentElement.setAttribute('lang', langue === 'en' ? 'en-US' : 'fr')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
